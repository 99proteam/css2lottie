name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck

  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Install Chromium (version pinned by playwright-core in the lockfile)
        run: npx playwright-core install --with-deps chromium
      - run: npm run build
      - run: npm test
      - name: Smoke-test the built CLI
        run: |
          node dist/cli.js examples/spinner.html -o /tmp/spinner.json --width 200 --height 200 --report
          node -e "const j=require('/tmp/spinner.json'); if(!j.layers.length) process.exit(1)"
