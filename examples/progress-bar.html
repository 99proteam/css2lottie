<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Progress bar</title>
    <style>
      body {
        margin: 0;
        width: 200px;
        height: 200px;
        display: grid;
        place-items: center;
      }
      .track {
        width: 160px;
        height: 14px;
        border-radius: 7px;
        background: #e5e7eb;
      }
      .bar {
        width: 14px;
        height: 14px;
        border-radius: 7px;
        background: #3b82f6;
        transition:
          width 2s cubic-bezier(0.4, 0, 0.2, 1),
          background-color 2s ease;
      }
      .track.done .bar {
        width: 160px;
        background-color: #22c55e;
      }
    </style>
  </head>
  <body>
    <div class="track"><div class="bar"></div></div>
    <script>
      // A transition triggered on load.
      window.addEventListener("load", () => {
        document.body.offsetWidth;
        document.querySelector(".track").classList.add("done");
      });
    </script>
  </body>
</html>
