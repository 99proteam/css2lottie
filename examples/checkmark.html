<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Checkmark</title>
    <style>
      body {
        margin: 0;
      }
      svg {
        display: block;
      }
      .circle {
        transform-box: fill-box;
        transform-origin: center;
        animation:
          pop 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) both,
          tint 0.6s ease 0.2s both;
      }
      .check {
        transform-box: fill-box;
        transform-origin: 30% 70%;
        animation: check-in 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.45s both;
      }
      @keyframes pop {
        from {
          transform: scale(0);
        }
        to {
          transform: scale(1);
        }
      }
      @keyframes tint {
        from {
          fill: #a7f3d0;
        }
        to {
          fill: #10b981;
        }
      }
      @keyframes check-in {
        from {
          transform: scale(0) rotate(-45deg);
          opacity: 0;
        }
        to {
          transform: scale(1) rotate(0deg);
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <svg width="200" height="200" viewBox="0 0 100 100">
      <circle class="circle" cx="50" cy="50" r="38" fill="#10b981" />
      <polyline
        class="check"
        points="32,52 45,64 69,38"
        fill="none"
        stroke="#ffffff"
        stroke-width="8"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>
  </body>
</html>
