<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Loading dots</title>
    <style>
      body {
        margin: 0;
        width: 200px;
        height: 200px;
        display: flex;
        gap: 14px;
        align-items: center;
        justify-content: center;
      }
      .dot {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: #8b5cf6;
        animation: hop 0.6s ease-in-out infinite alternate;
      }
      .dot:nth-child(2) {
        animation-delay: 0.2s;
        background: #a78bfa;
      }
      .dot:nth-child(3) {
        animation-delay: 0.4s;
        background: #c4b5fd;
      }
      @keyframes hop {
        from {
          transform: translateY(12px);
          opacity: 0.35;
        }
        to {
          transform: translateY(-12px);
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
  </body>
</html>
