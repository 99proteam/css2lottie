<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Text wave</title>
    <style>
      @font-face {
        font-family: "Instrument Sans";
        src: url("fonts/InstrumentSans-Bold.ttf") format("truetype");
        font-weight: 700;
      }
      body {
        margin: 0;
        width: 320px;
        height: 120px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .word span {
        display: inline-block;
        font:
          700 48px "Instrument Sans",
          sans-serif;
        color: #0f172a;
        animation: wave 1.2s ease-in-out infinite;
      }
      .word span:nth-child(2) {
        animation-delay: -1.1s;
      }
      .word span:nth-child(3) {
        animation-delay: -1s;
      }
      .word span:nth-child(4) {
        animation-delay: -0.9s;
      }
      .word span:nth-child(5) {
        animation-delay: -0.8s;
      }
      .word span:nth-child(6) {
        animation-delay: -0.7s;
      }
      @keyframes wave {
        0%,
        60%,
        100% {
          transform: translateY(0);
          color: #0f172a;
        }
        30% {
          transform: translateY(-16px);
          color: #6366f1;
        }
      }
    </style>
  </head>
  <body>
    <div class="word">
      <span>L</span><span>o</span><span>t</span><span>t</span><span>i</span><span>e</span>
    </div>
  </body>
</html>
