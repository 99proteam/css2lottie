<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Card flip</title>
    <style>
      @font-face {
        font-family: "Instrument Sans";
        src: url("fonts/InstrumentSans-Bold.ttf") format("truetype");
        font-weight: 700;
      }
      body {
        margin: 0;
        width: 200px;
        height: 200px;
        display: grid;
        place-items: center;
      }
      .scene {
        width: 120px;
        height: 160px;
        perspective: 600px;
      }
      .card {
        position: relative;
        width: 100%;
        height: 100%;
        transform-style: preserve-3d;
        animation: flip 3s ease-in-out infinite;
      }
      .face {
        position: absolute;
        inset: 0;
        border-radius: 14px;
        backface-visibility: hidden;
        display: grid;
        place-items: center;
        font:
          700 44px "Instrument Sans",
          sans-serif;
        color: #ffffff;
      }
      .front {
        background: #6366f1;
      }
      .back {
        background: #ec4899;
        transform: rotateY(180deg);
      }
      @keyframes flip {
        0%,
        20% {
          transform: rotateY(0deg);
        }
        50%,
        70% {
          transform: rotateY(180deg);
        }
        100% {
          transform: rotateY(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="scene">
      <div class="card">
        <div class="face front">A</div>
        <div class="face back">B</div>
      </div>
    </div>
  </body>
</html>
